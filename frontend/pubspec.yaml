name: kae_music
description: "KAEMusic — A premium music streaming application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.0.0

  # HTTP
  dio: ^5.4.3

  # Secure Storage (web-compatible)
  flutter_secure_storage: ^9.2.2

  # Audio
  just_audio: ^0.9.40
  just_audio_web: ^0.4.14

  # Cached Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Fonts & SVG
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Utils
  equatable: ^2.0.5
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
